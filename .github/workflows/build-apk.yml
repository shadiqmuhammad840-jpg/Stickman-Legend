name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan proyek Android
        run: |
          mkdir www && cp index.html www/index.html
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          # paksa landscape
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
          # layar penuh (sembunyikan bar status & navigasi)
          cat > android/app/src/main/java/com/stickman/legend/MainActivity.java <<'JAVA'
          package com.stickman.legend;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              hide();
            }
            @Override public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) hide();
            }
            private void hide() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
            }
          }
          JAVA
          # ikon aplikasi
          npm i -D @capacitor/assets@3 && npx capacitor-assets generate --android --iconBackgroundColor '#12121a' || echo "ikon default dipakai"
          npx cap sync android

      - name: Tanda tangan tetap + nomor versi naik (agar bisa update tanpa bentrok)
        run: |
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: stickman-legend-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Buat Release (unduh langsung dari HP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Stickman-Legend.apk
          gh release create "v${{ github.run_number }}" Stickman-Legend.apk --title "Stickman Legend v${{ github.run_number }}" --notes "Unduh Stickman-Legend.apk lalu pasang di HP Android."
